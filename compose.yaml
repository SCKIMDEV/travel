# Travel Diary 정적 서버 (parking 과 같은 방식: Docker 컨테이너 + restart 정책)
# - 127.0.0.1:8787 에서만 받고, 외부 기기 접속은 Tailscale Serve 가 https://parking.tail7d1054.ts.net:8443/ 로 중계한다.
# - 실행: docker compose up -d   /  중지: docker compose down
services:
  diary:
    image: nginx:1.27-alpine
    container_name: travel-diary
    ports:
      - "127.0.0.1:8787:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
