# Travel Diary 용 nginx 설정 (compose.yaml 이 /etc/nginx/conf.d/default.conf 로 마운트)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 사이트 파일이 아닌 것들은 내려주지 않는다
    location ~ /\. { deny all; }
    location ~* \.(md|ya?ml|cmd|ps1|bat|conf)$ { deny all; }

    # 수정이 바로 반영되도록 캐시를 쓰지 않게 한다
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
